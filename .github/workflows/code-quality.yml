# Shared code-quality scan (Jira RRDPLAT-44). Manual only: routine dev scans run
# in the ReleaseReady Dev app to save GitHub Actions minutes (owner decision,
# 12 Nov 2026). Kept as an on-demand fallback; Actions are for production
# deployment builds. Separate from the repo's own quality.yml.
name: Code quality
on: workflow_dispatch
permissions:
  contents: read
jobs:
  quality:
    uses: noisegatemusicstudio/code-quality/.github/workflows/quality-scan.yml@42901d2ec06886ca0cc6b051b1690cf1f9b92959
    with:
      code-quality-ref: 42901d2ec06886ca0cc6b051b1690cf1f9b92959
      enforce: false
