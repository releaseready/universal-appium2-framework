# Manual only: GitHub Actions minutes are reserved for production deployment
# builds (owner decision, 12 Nov 2026). Run `npm run check:offline` locally; the
# ReleaseReady Dev app runs code-quality scans on every push.
name: Quality checks

on:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified official v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # verified official v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check, lint, format and test offline contracts
        run: npm run check:offline
